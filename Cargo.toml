[package]
name = "catboost-rust"
version = "0.2.0"
edition = "2018"
description = "Rust bindings for CatBoost, a gradient boosting library for machine learning. Downloads CatBoost binaries at runtime for cross-platform compatibility."
license = "Apache-2.0"
repository = "https://github.com/aryehklein/catboost-rust"
keywords = ["machine-learning", "gradient-boosting", "catboost", "ml", "ai", "data-science"]
categories = ["science", "machine-learning"]
readme = "README.md"
rust-version = "1.70"

[dependencies]
approx = "0.5.1"

[build-dependencies]
bindgen = "~0.59"
ureq = "2.0"
flate2 = "1.0"
tar = "0.4"
zip = "0.6"

[features]
gpu = []

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[[example]]
name = "advanced_usage"
path = "examples/advanced_usage.rs"

[[example]]
name = "gpu_usage"
path = "examples/gpu_usage.rs"
