[package]
name = "catboost-rust"
version = "0.3.6"
edition = "2024"
description = "Rust bindings for CatBoost, a gradient boosting library for machine learning. Downloads CatBoost binaries at runtime for cross-platform compatibility."
license = "Apache-2.0"
repository = "https://github.com/aryehlev/catboost-rust"
keywords = ["machine-learning", "gradient-boosting", "catboost", "ml"]
categories = ["science"]
readme = "README.md"
rust-version = "1.85"

[dependencies]
polars = { version = "0.45", optional = true, default-features = false, features = ["dtype-full"] }

[build-dependencies]
bindgen = "0.72.0"
ureq = "2.0"
flate2 = "1.0"
tar = "0.4"
zip = "0.6"

[features]
gpu = []
polars = ["dep:polars"]

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[[example]]
name = "advanced_usage"
path = "examples/advanced_usage.rs"

[[example]]
name = "gpu_usage"
path = "examples/gpu_usage.rs"
