[package]
name = "catboost-sys"
version = "0.1.0"
authors = ["Sergey Kiselev <kiselev.sg@gmail.com>"]
edition = "2018"
description = "Low-level Rust bindings for CatBoost C++ library"
license = "Apache-2.0"
repository = "https://github.com/your-username/catboost-rs"
keywords = ["machine-learning", "gradient-boosting", "catboost", "ml", "ffi"]
categories = ["science", "machine-learning", "external-ffi-bindings"]

[build-dependencies]
bindgen = "~0.59"
ureq = "2.0"
flate2 = "1.0"
tar = "0.4"
zip = "0.6"

[features]
gpu = []
